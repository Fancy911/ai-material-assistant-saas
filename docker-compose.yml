services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_material
      POSTGRES_USER: ai_material
      POSTGRES_PASSWORD: ai_material_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_material -d ai_material"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:

