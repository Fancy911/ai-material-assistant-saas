services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_material
      POSTGRES_USER: ai_material
      POSTGRES_PASSWORD: ai_material_dev_password
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_material -d ai_material"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://ai_material:ai_material_dev_password@postgres:5432/ai_material?schema=public
      PORT: "3000"
    ports:
      - "${API_HOST_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
